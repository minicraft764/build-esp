name: Build ESP32 Binary

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Install Compatible ESP32 Board Core (v2.0.14)
        run: |
          arduino-cli config init
          arduino-cli config set board_manager.additional_urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@2.0.14

      - name: Restructure into Match Folder
        run: |
          mkdir -p esp32-u2f-ble
          shopt -s extglob
          for f in !(esp32-u2f-ble|.git|.github); do
            mv "$f" esp32-u2f-ble/
          done

      - name: Compile Sketch
        run: |
          mkdir -p build
          arduino-cli compile --fqbn esp32:esp32:esp32 --output-dir ./build ./esp32-u2f-ble

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: esp32-firmware
          path: ./build/*.bin
